version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    command: npx serve dist -l 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/dist:/app/dist:ro
    depends_on:
      - backend
    restart: unless-stopped
